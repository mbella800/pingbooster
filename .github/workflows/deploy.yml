# Deploys the website to Cloudflare Workers.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — dash.cloudflare.com → profile icon → API Tokens →
#                            Create Token → "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — Workers & Pages overview page, right-hand sidebar
#
# Until both secrets exist, the deploy step is skipped and the run stays green,
# so adding this workflow does not break CI for anyone.
#
# The wrangler config is generated by the build at dist/server/wrangler.json
# (worker name comes from package.json "name": pingbooster). First deploy
# creates the worker; the URL is printed at the end of the deploy step's log
# and looks like https://pingbooster.<your-subdomain>.workers.dev

name: Deploy site

on:
  push:
    branches:
      - main
      # Allows deploying from working branches before anything is merged to
      # main. Same worker name, so a branch deploy replaces the live version —
      # fine while there is a single environment; split names if that changes.
      - "claude/**"
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Attach custom domain
        # Set a repository VARIABLE (Settings → Secrets and variables → Actions →
        # Variables tab, not a secret) named SITE_DOMAIN, e.g. example.com.
        # The deploy then serves the site on the apex and www of that domain —
        # Cloudflare creates the DNS records and certificate automatically,
        # since the domain's zone lives in the same account. Without the
        # variable, the site is only on the workers.dev URL.
        if: env.HAS_CF_SECRETS == 'true' && vars.SITE_DOMAIN != ''
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          jq --arg d "$SITE_DOMAIN" \
            '.routes = [{pattern: $d, custom_domain: true}, {pattern: ("www." + $d), custom_domain: true}]' \
            dist/server/wrangler.json > wrangler.patched.json
          mv wrangler.patched.json dist/server/wrangler.json
          echo "Deploying to https://$SITE_DOMAIN and https://www.$SITE_DOMAIN"

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c dist/server/wrangler.json

      - name: Secrets not configured
        if: env.HAS_CF_SECRETS != 'true'
        run: |
          echo "::notice::Build succeeded. Deploy skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions to enable it."
