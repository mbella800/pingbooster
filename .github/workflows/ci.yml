# Validate the website, Rust decision core, and Windows desktop preview on every push.
#
# Deployment is handled by Vercel's Git integration, not by this workflow —
# once the repository is imported at vercel.com, every push deploys
# automatically and pull requests get preview URLs. No tokens or secrets are
# needed in GitHub for that.
#
# The site also still builds for Cloudflare Workers via `npm run cf:build`
# (vinext); that path is kept for reference but is not deployed from here.

name: CI

on:
  push:
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Next.js, what Vercel runs)
        run: npm run build

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Check desktop JavaScript
        working-directory: desktop
        run: npm run check && npm test

      - name: Package Windows preview
        working-directory: desktop
        run: npm run package:win

      - uses: actions/upload-artifact@v4
        with:
          name: ping-optimizer-windows-preview
          path: desktop/release/Ping Optimizer-win32-x64/**
          if-no-files-found: error
